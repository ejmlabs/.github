# Generated by scripts/build_workflows.py. Edit scripts and regenerate.
"name": "Checked draft source release"
"on":
  "workflow_call":
    "inputs":
      "commit":
        "required": true
        "type": "string"
      "version":
        "required": true
        "type": "string"
      "standards-ref":
        "required": true
        "type": "string"
"permissions": {}
"concurrency":
  "group": "draft-release-${{ github.repository }}"
  "cancel-in-progress": false
"jobs":
  "draft":
    "if": "${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 8
    "permissions":
      "contents": "write"
      "pull-requests": "read"
      "statuses": "read"
    "env":
      "GH_TOKEN": "${{ github.token }}"
      "RELEASE_COMMIT": "${{ inputs.commit }}"
      "RELEASE_VERSION": "${{ inputs.version }}"
      "STANDARDS_REF": "${{ inputs.standards-ref }}"
    "steps":
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "with":
          "path": "product"
          "ref": "${{ inputs.commit }}"
          "persist-credentials": false
          "fetch-depth": 1
          "submodules": false
      -
        "name": "Validate protected source and prepare assets without executing project code"
        "shell": "bash"
        "run": |
          python3 -I -  <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
      -
        "name": "Create a new tag and draft release without replacing anything"
        "shell": "bash"
        "run": |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          manifest = json.loads(Path('release-assets/provenance.json').read_text())
          tag = 'v' + manifest['version']
          repo = os.environ['GITHUB_REPOSITORY']
          # VERSION is already validated; hyphens in build metadata do not mark prereleases.
          prerelease_flags = ['--prerelease', '--latest=false'] if '-' in manifest['version'].split('+', 1)[0] else []
          # No --force, --clobber, or implicit existing-tag acceptance.
          subprocess.run(['gh', 'api', '--method', 'POST', 'repos/' + repo + '/git/refs', '-f', 'ref=refs/tags/' + tag, '-f', 'sha=' + manifest['commit']], check=True)
          subprocess.run(['gh', 'release', 'create', tag, '--repo', repo, '--verify-tag', '--draft', '--title', tag, '--notes-file', 'release-notes.md', *prerelease_flags, *[str(p) for p in sorted(Path('release-assets').iterdir())]], check=True)
          PY
