# Generated by scripts/build_workflows.py. Edit scripts and regenerate.
"name": "Warm trusted gate build caches"
"on":
  "workflow_call": {}
"permissions": {}
"concurrency":
  "group": "warm-cache-${{ github.repository }}"
  "cancel-in-progress": true
"jobs":
  "quality":
    "if": "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(fromJSON('[\"ejm-cli\",\"ejm-harness\",\"ejm-ide\",\"ejm-ui\"]'), github.event.repository.name) }}"
    "runs-on": "${{ matrix.os }}"
    "timeout-minutes": 45
    "strategy":
      "fail-fast": false
      "matrix":
        "os": "${{ fromJSON(github.event.repository.name == 'ejm-harness' && '[\"ubuntu-24.04\",\"macos-15\",\"windows-2025\"]' || github.event.repository.name == 'ejm-cli' && '[\"ubuntu-24.04\",\"macos-15\"]' || github.event.repository.name == 'ejm-ide' && '[\"macos-15\"]' || '[\"ubuntu-24.04\"]') }}"
    "env":
      "CARGO_BUILD_JOBS": "default"
      "CARGO_INCREMENTAL": "0"
      "PROFILE": "${{ github.event.repository.name }}"
      "CI": "true"
    "permissions":
      "contents": "read"
    "steps":
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "with":
          "path": "product"
          "ref": "${{ github.sha }}"
          "persist-credentials": false
          "fetch-depth": 1
          "submodules": false
      -
        "name": "Read main's reviewed dependency pins"
        "shell": "bash"
        "run": |
          python3 - warm-pins <<'TRUSTED_PYTHON'
          import base64, bz2
          exec(compile(bz2.decompress(base64.b64decode('')), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "id": "pins"
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "if": "${{ steps.pins.outputs.harness != '' }}"
        "with":
          "repository": "ejmlabs/ejm-harness"
          "ref": "${{ steps.pins.outputs.harness }}"
          "path": "ejm-harness"
          "persist-credentials": false
          "fetch-depth": 1
          "submodules": false
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "if": "${{ steps.pins.outputs.ui != '' }}"
        "with":
          "repository": "ejmlabs/ejm-ui"
          "ref": "${{ steps.pins.outputs.ui }}"
          "path": "ejm-ui"
          "persist-credentials": false
          "fetch-depth": 1
          "submodules": false
      -
        "name": "Match the gate's exported source layout"
        "shell": "bash"
        "run": |
          rm -rf product/.git ejm-harness/.git ejm-ui/.git
      -
        "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        "with":
          "node-version": "24"
      -
        "uses": "astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884"
        "with":
          "version": "0.9.26"
      -
        "name": "Install Linux harness keyring build prerequisites"
        "shell": "bash"
        "run": |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libdbus-1-dev
        "if": "${{ github.event.repository.name == 'ejm-harness' && runner.os == 'Linux' }}"
      -
        "name": "Install pinned Rust tools"
        "shell": "bash"
        "run": |
          if [[ "$PROFILE" == ejm-* ]]; then
            rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
            rustup default 1.99.1
            if [[ "$PROFILE" != ejm-ui ]]; then
          python3 -I - cargo-deny cargo-machete <<'TRUSTED_PYTHON'
          import base64, bz2
          exec(compile(bz2.decompress(base64.b64decode('')), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
            fi
          fi
      -
        "name": "Prepare ejm-cli remote test prerequisites"
        "if": "${{ github.event.repository.name == 'ejm-cli' }}"
        "uses": "./product/.github/actions/setup-ci"
      -
        "name": "Run the project's required gate without secrets or write tokens"
        "shell": "bash"
        "run": |
          cd product
          if [[ -d ../ejm-ui ]]; then
            npm --prefix ../ejm-ui ci --ignore-scripts
          fi
          case "$PROFILE" in
            ejm-cli) ./scripts/check ;;
            ejm-harness) npm ci --ignore-scripts; npm --prefix registry ci --ignore-scripts; ./scripts/check ;;
            ejm-ide) npm ci --ignore-scripts; npm run verify; npm run site:check; npm run site:build ;;
            ejm-ui)
              export npm_config_ignore_scripts=true
              npm ci --ignore-scripts
              npm rebuild node-pty --ignore-scripts=false
              npm run check
              npm run build
              npm run check:rust
              node scripts/pack-proof.mjs
              ;;
            ejmlabs) node scripts/check.mjs; npm --prefix site test; npm --prefix site run build ;;
            .github) python3 -m unittest discover -s tests -v; python3 scripts/build_workflows.py --check ;;
            *) exit 1 ;;
          esac
      -
        "uses": "actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9"
        "if": "${{ !cancelled() }}"
        "with":
          "path": |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ fromJSON('{"ejm-cli":"product/target","ejm-harness":"product/target","ejm-ide":"product/src-tauri/target","ejm-ui":"product/crates/ejm-tui/target"}')[github.event.repository.name] }}
          "key": "gate-quality-${{ runner.os }}-${{ github.sha }}"
  "registry":
    "if": "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(fromJSON('[\"ejm-harness\"]'), github.event.repository.name) }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 25
    "env":
      "CARGO_BUILD_JOBS": "default"
      "CARGO_INCREMENTAL": "0"
      "PROFILE": "${{ github.event.repository.name }}"
    "permissions":
      "contents": "read"
    "steps":
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "with":
          "path": "product"
          "ref": "${{ github.sha }}"
          "persist-credentials": false
          "fetch-depth": 1
          "submodules": false
      -
        "name": "Read main's reviewed dependency pins"
        "shell": "bash"
        "run": |
          python3 - warm-pins <<'TRUSTED_PYTHON'
          import base64, bz2
          exec(compile(bz2.decompress(base64.b64decode('')), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "id": "pins"
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "if": "${{ steps.pins.outputs.harness != '' }}"
        "with":
          "repository": "ejmlabs/ejm-harness"
          "ref": "${{ steps.pins.outputs.harness }}"
          "path": "ejm-harness"
          "persist-credentials": false
          "fetch-depth": 1
          "submodules": false
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "if": "${{ steps.pins.outputs.ui != '' }}"
        "with":
          "repository": "ejmlabs/ejm-ui"
          "ref": "${{ steps.pins.outputs.ui }}"
          "path": "ejm-ui"
          "persist-credentials": false
          "fetch-depth": 1
          "submodules": false
      -
        "name": "Match the gate's exported source layout"
        "shell": "bash"
        "run": |
          rm -rf product/.git ejm-harness/.git ejm-ui/.git
      -
        "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        "if": "${{ github.event.repository.name == 'ejm-harness' }}"
        "with":
          "node-version": "24"
      -
        "name": "Run separate registry gate when applicable"
        "shell": "bash"
        "run": |
          if [[ "$PROFILE" == ejm-harness ]]; then
            rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
            rustup default 1.99.1
          python3 -I - cargo-deny cargo-machete <<'TRUSTED_PYTHON'
          import base64, bz2
          exec(compile(bz2.decompress(base64.b64decode('')), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
            cargo install worker-build --version 0.8.7 --locked
            cd product
            if [[ -d ../ejm-ui ]]; then
              npm --prefix ../ejm-ui ci --ignore-scripts
            fi
            npm ci --ignore-scripts
            npm --prefix registry ci --ignore-scripts
            ./scripts/check-registry
          fi
      -
        "uses": "actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9"
        "if": "${{ !cancelled() }}"
        "with":
          "path": |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ fromJSON('{"ejm-harness":"product/registry/target"}')[github.event.repository.name] }}
          "key": "gate-registry-${{ runner.os }}-${{ github.sha }}"
