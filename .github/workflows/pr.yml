name: Human-admitted PR checks
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled]
permissions: {}
jobs:
  governance:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ejmlabs/.github/.github/workflows/governance.yml@b4b5de4e323b42dc78cb06d9d302f75bef5a1b61
    secrets:
      EJM_HARNESS_TOKEN: ${{ secrets.EJM_HARNESS_TOKEN }}
