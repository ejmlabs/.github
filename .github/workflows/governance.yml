# Generated by scripts/build_workflows.py. Edit scripts and regenerate.
"name": "Human-admitted PR checks"
"on":
  "workflow_call":
    "secrets":
      "EJM_HARNESS_TOKEN":
        "required": false
"permissions": {}
"jobs":
  "admission":
    "if": "${{ github.event_name == 'pull_request' && contains(fromJSON('[\"opened\",\"reopened\",\"synchronize\",\"ready_for_review\",\"converted_to_draft\",\"labeled\"]'), github.event.action) && (github.event.action != 'labeled' || github.event.label.name == 'gate:approve' || github.event.label.name == 'gate:revoke') }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 3
    "permissions":
      "contents": "read"
      "pull-requests": "write"
      "statuses": "write"
      "actions": "write"
    "concurrency":
      "group": "gate-${{ github.repository }}-${{ github.event.pull_request.head.sha }}"
      "cancel-in-progress": false
    "outputs":
      "run": "${{ steps.admit.outputs.run }}"
      "pr": "${{ steps.admit.outputs.pr }}"
      "head": "${{ steps.admit.outputs.head }}"
      "base": "${{ steps.admit.outputs.base }}"
      "profile": "${{ steps.admit.outputs.profile }}"
    "steps":
      -
        "name": "Admit from PR state or handle gate labels"
        "shell": "bash"
        "run": |
          python3 -I - admit <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "id": "admit"
        "env":
          "GH_TOKEN": "${{ github.token }}"
  "prepare":
    "needs": "admission"
    "if": "${{ needs.admission.outputs.run == 'true' }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 5
    "permissions":
      "contents": "read"
      "pull-requests": "read"
      "statuses": "read"
    "env":
      "PR_NUMBER": "${{ needs.admission.outputs.pr }}"
      "PR_HEAD": "${{ needs.admission.outputs.head }}"
      "PR_BASE": "${{ needs.admission.outputs.base }}"
      "GH_TOKEN": "${{ github.token }}"
    "outputs":
      "artifact": "${{ steps.sources.outputs.artifact-id }}"
    "steps":
      -
        "name": "Recheck current human admission"
        "shell": "bash"
        "run": |
          python3 -I - verify <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "with":
          "path": "product"
          "ref": "${{ needs.admission.outputs.head }}"
          "persist-credentials": false
          "fetch-depth": 1
          "submodules": false
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "with":
          "path": "base"
          "ref": "${{ needs.admission.outputs.base }}"
          "persist-credentials": false
          "fetch-depth": 1
          "submodules": false
      -
        "name": "Select the admitted harness dependency against trusted source authority"
        "shell": "bash"
        "run": |
          python3 -I - select-harness <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "id": "harness"
        "env":
          "PROFILE": "${{ needs.admission.outputs.profile }}"
          "HARNESS_READ_TOKEN": "${{ secrets.EJM_HARNESS_TOKEN || github.token }}"
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "if": "${{ steps.harness.outputs.revision != '' }}"
        "with":
          "repository": "ejmlabs/ejm-harness"
          "ref": "${{ steps.harness.outputs.revision }}"
          "path": "harness"
          "persist-credentials": false
          "token": "${{ secrets.EJM_HARNESS_TOKEN || github.token }}"
      -
        "name": "Read optional public UI dependency from trusted main"
        "shell": "bash"
        "run": |
          python3 -I - ui-pin <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "id": "ui"
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "if": "${{ steps.ui.outputs.revision != '' }}"
        "with":
          "repository": "ejmlabs/ejm-ui"
          "ref": "${{ steps.ui.outputs.revision }}"
          "path": "ejm-ui"
          "persist-credentials": false
          "fetch-depth": 1
          "submodules": false
      -
        "name": "Archive admitted source"
        "shell": "bash"
        "run": |
          python3 -I -  <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
      -
        "name": "Recheck current human admission"
        "shell": "bash"
        "run": |
          python3 -I - verify <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
      -
        "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        "id": "sources"
        "with":
          "name": "admitted-sources-${{ github.run_attempt }}"
          "path": "prepared/"
          "retention-days": 3
          "if-no-files-found": "error"
  "quality":
    "needs":
      - "admission"
      - "prepare"
    "runs-on": "${{ matrix.os }}"
    "timeout-minutes": 45
    "permissions": {}
    "strategy":
      "fail-fast": false
      "matrix":
        "os": "${{ fromJSON(needs.admission.outputs.profile == 'ejm-harness' && '[\"ubuntu-24.04\",\"macos-15\",\"windows-2025\"]' || needs.admission.outputs.profile == 'ejm-cli' && '[\"ubuntu-24.04\",\"macos-15\"]' || needs.admission.outputs.profile == 'ejm-ide' && '[\"macos-15\"]' || '[\"ubuntu-24.04\"]') }}"
    "env":
      "CARGO_BUILD_JOBS": "default"
      "CARGO_INCREMENTAL": "0"
      "PROFILE": "${{ needs.admission.outputs.profile }}"
      "CI": "true"
    "steps":
      -
        "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"
        "with":
          "artifact-ids": "${{ needs.prepare.outputs.artifact }}"
          "merge-multiple": true
          "path": "prepared"
      -
        "name": "Extract source data safely"
        "shell": "bash"
        "run": |
          python3 -I -  <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
      -
        "uses": "actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9"
        "if": "${{ contains(fromJSON('[\"ejm-cli\",\"ejm-harness\",\"ejm-ide\",\"ejm-ui\"]'), needs.admission.outputs.profile) }}"
        "with":
          "path": |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ fromJSON('{"ejm-cli":"product/target","ejm-harness":"product/target","ejm-ide":"product/src-tauri/target","ejm-ui":"product/crates/ejm-tui/target"}')[needs.admission.outputs.profile] }}
          "key": "gate-quality-${{ runner.os }}-rust1.99.1-${{ hashFiles(fromJSON('{\"ejm-cli\":\"product/Cargo.lock\",\"ejm-harness\":\"product/Cargo.lock\",\"ejm-ide\":\"product/src-tauri/Cargo.lock\",\"ejm-ui\":\"product/crates/ejm-tui/Cargo.lock\"}')[needs.admission.outputs.profile]) }}"
          "restore-keys": "gate-quality-${{ runner.os }}-rust1.99.1-"
      -
        "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        "with":
          "node-version": "24"
      -
        "uses": "astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884"
        "with":
          "version": "0.9.26"
          "enable-cache": false
      -
        "name": "Install Linux harness keyring build prerequisites"
        "shell": "bash"
        "run": |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libdbus-1-dev
        "if": "${{ needs.admission.outputs.profile == 'ejm-harness' && runner.os == 'Linux' }}"
      -
        "name": "Install pinned Rust tools"
        "shell": "bash"
        "run": |
          if [[ "$PROFILE" == ejm-* ]]; then
            rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
            rustup default 1.99.1
            if [[ "$PROFILE" != ejm-ui ]]; then
          python3 -I - cargo-deny cargo-machete <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
            fi
          fi
      -
        "name": "Prepare ejm-cli remote test prerequisites"
        "if": "${{ needs.admission.outputs.profile == 'ejm-cli' }}"
        "uses": "./product/.github/actions/setup-ci"
      -
        "name": "Run the project's required gate without secrets or write tokens"
        "shell": "bash"
        "run": |
          cd product
          if [[ -d ../ejm-ui ]]; then
            npm --prefix ../ejm-ui ci --ignore-scripts
          fi
          if [[ ! -L .github && ! -L .github/quality && -f .github/quality && -x .github/quality ]]; then
            export npm_config_ignore_scripts=true
            ./.github/quality
          else
            case "$PROFILE" in
              ejm-cli) ./scripts/check ;;
              ejm-harness) npm ci --ignore-scripts; npm --prefix registry ci --ignore-scripts; ./scripts/check ;;
              ejm-ide) npm ci --ignore-scripts; npm run verify; npm run site:check; npm run site:build ;;
              ejm-ui)
                export npm_config_ignore_scripts=true
                npm ci --ignore-scripts
                npm rebuild node-pty --ignore-scripts=false
                npm run check
                npm run build
                npm run check:rust
                node scripts/pack-proof.mjs
                ;;
              ejmlabs) node scripts/check.mjs; npm --prefix site test; npm --prefix site run build ;;
              .github) python3 -m unittest discover -s tests -v; python3 scripts/build_workflows.py --check ;;
              *) exit 1 ;;
            esac
          fi
  "registry":
    "needs":
      - "admission"
      - "prepare"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 25
    "permissions": {}
    "env":
      "CARGO_BUILD_JOBS": "default"
      "CARGO_INCREMENTAL": "0"
      "PROFILE": "${{ needs.admission.outputs.profile }}"
    "steps":
      -
        "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"
        "with":
          "artifact-ids": "${{ needs.prepare.outputs.artifact }}"
          "merge-multiple": true
          "path": "prepared"
      -
        "name": "Extract source data safely"
        "shell": "bash"
        "run": |
          python3 -I -  <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
      -
        "uses": "actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9"
        "if": "${{ contains(fromJSON('[\"ejm-harness\"]'), needs.admission.outputs.profile) }}"
        "with":
          "path": |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ fromJSON('{"ejm-harness":"product/registry/target"}')[needs.admission.outputs.profile] }}
          "key": "gate-registry-${{ runner.os }}-rust1.99.1-${{ hashFiles(fromJSON('{\"ejm-harness\":\"product/registry/Cargo.lock\"}')[needs.admission.outputs.profile]) }}"
          "restore-keys": "gate-registry-${{ runner.os }}-rust1.99.1-"
      -
        "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        "if": "${{ needs.admission.outputs.profile == 'ejm-harness' }}"
        "with":
          "node-version": "24"
      -
        "name": "Run separate registry gate when applicable"
        "shell": "bash"
        "run": |
          if [[ "$PROFILE" == ejm-harness ]]; then
            rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
            rustup default 1.99.1
          python3 -I - cargo-deny cargo-machete <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
            cargo install worker-build --version 0.8.7 --locked
            cd product
            if [[ -d ../ejm-ui ]]; then
              npm --prefix ../ejm-ui ci --ignore-scripts
            fi
            if [[ ! -L .github && ! -L .github/quality-registry && -f .github/quality-registry && -x .github/quality-registry ]]; then
              export npm_config_ignore_scripts=true
              ./.github/quality-registry
            else
              npm ci --ignore-scripts
              npm --prefix registry ci --ignore-scripts
              ./scripts/check-registry
            fi
          fi
  "standards":
    "needs":
      - "admission"
      - "prepare"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 3
    "permissions": {}
    "env":
      "PROFILE": "${{ needs.admission.outputs.profile }}"
    "steps":
      -
        "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"
        "with":
          "artifact-ids": "${{ needs.prepare.outputs.artifact }}"
          "merge-multiple": true
          "path": "prepared"
      -
        "name": "Extract source data safely"
        "shell": "bash"
        "run": |
          python3 -I -  <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
      -
        "name": "Validate shared public standards and version metadata"
        "shell": "bash"
        "run": |
          python3 -I - product "$PROFILE" <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
      -
        "name": "Fetch the shared agent templates at this workflow's commit"
        "shell": "bash"
        "run": |
          if [[ "$WORKFLOW_REPOSITORY" != ejmlabs/.github || ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The shared gate must run from ejmlabs/.github at a full commit SHA"
            exit 1
          fi
          git init -q shared
          git -C shared -c credential.helper= fetch -q --depth 1 --no-tags https://github.com/ejmlabs/.github.git "$WORKFLOW_SHA"
          git -C shared -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
        "env":
          "WORKFLOW_REPOSITORY": "${{ job.workflow_repository }}"
          "WORKFLOW_SHA": "${{ job.workflow_sha }}"
          "GIT_TERMINAL_PROMPT": "0"
        "if": "${{ needs.admission.outputs.profile != '.github' }}"
      -
        "name": "Check the shared agent skills and house rules"
        "shell": "bash"
        "run": |
          templates=shared/templates/agents
          if [[ "$PROFILE" == .github ]]; then
            templates=product/templates/agents
          fi
          trap 'echo "::error::Shared agent files differ from ejmlabs/.github at $WORKFLOW_SHA. From a checkout of that commit, run: python3 scripts/sync_agents.py PATH_TO_THIS_REPOSITORY"' ERR
          python3 -I - --check --templates "$templates" product <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "env":
          "WORKFLOW_SHA": "${{ job.workflow_sha }}"
  "finish":
    "needs":
      - "admission"
      - "prepare"
      - "quality"
      - "registry"
      - "standards"
    "if": "${{ !cancelled() && needs.admission.outputs.run == 'true' }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 3
    "permissions":
      "contents": "read"
      "pull-requests": "write"
      "statuses": "write"
    "env":
      "PR_NUMBER": "${{ needs.admission.outputs.pr }}"
      "PR_HEAD": "${{ needs.admission.outputs.head }}"
      "PR_BASE": "${{ needs.admission.outputs.base }}"
      "GH_TOKEN": "${{ github.token }}"
      "JOB_RESULTS": "${{ toJSON(needs) }}"
    "steps":
      -
        "name": "Publish required results only after live admission validation"
        "shell": "bash"
        "run": |
          python3 -I - finish <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
