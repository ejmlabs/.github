# Generated by scripts/build_workflows.py. Edit scripts and regenerate.
"name": "Human-admitted PR checks"
"on":
  "workflow_call":
    "secrets":
      "XAI_API_KEY":
        "required": false
      "EJM_HARNESS_TOKEN":
        "required": false
"permissions": {}
"jobs":
  "admission":
    "if": "${{ github.run_attempt == 1 && github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(fromJSON('[\"OWNER\",\"MEMBER\",\"COLLABORATOR\"]'), github.event.comment.author_association) && ((github.event.action == 'created' && github.event.sender.type == 'User' && (startsWith(github.event.comment.body, '/ready ') || startsWith(github.event.comment.body, '/approve ') || startsWith(github.event.comment.body, '/revoke '))) || (github.event.action != 'created' && (startsWith(github.event.comment.body, '/ready ') || startsWith(github.event.comment.body, '/approve ') || startsWith(github.event.changes.body.from, '/ready ') || startsWith(github.event.changes.body.from, '/approve ')))) }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 3
    "permissions":
      "contents": "read"
      "pull-requests": "write"
      "statuses": "write"
      "actions": "write"
    "concurrency":
      "group": "human-command-${{ github.repository }}-${{ github.event.issue.number }}"
      "cancel-in-progress": false
    "outputs":
      "run": "${{ steps.admit.outputs.run }}"
      "pr": "${{ steps.admit.outputs.pr }}"
      "head": "${{ steps.admit.outputs.head }}"
      "base": "${{ steps.admit.outputs.base }}"
      "admission": "${{ steps.admit.outputs.admission }}"
      "profile": "${{ steps.admit.outputs.profile }}"
    "steps":
      -
        "name": "Validate live maintainer and commit; consume once"
        "shell": "bash"
        "run": |
          python3 - admit <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "id": "admit"
        "env":
          "GH_TOKEN": "${{ github.token }}"
  "prepare":
    "needs": "admission"
    "if": "${{ github.run_attempt == 1 && needs.admission.outputs.run == 'true' }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 5
    "permissions":
      "contents": "read"
      "pull-requests": "read"
      "statuses": "read"
    "env":
      "PR_NUMBER": "${{ needs.admission.outputs.pr }}"
      "PR_HEAD": "${{ needs.admission.outputs.head }}"
      "PR_BASE": "${{ needs.admission.outputs.base }}"
      "ADMISSION_ID": "${{ needs.admission.outputs.admission }}"
      "GH_TOKEN": "${{ github.token }}"
    "outputs":
      "artifact": "${{ steps.sources.outputs.artifact-id }}"
    "steps":
      -
        "name": "Require private review logs"
        "shell": "bash"
        "run": |
          python3 -  <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode('aW1wb3J0IG9zCmlmIG9zLmVudmlyb24uZ2V0KCdSVU5ORVJfREVCVUcnKSA9PSAnMSc6CiAgICByYWlzZSBTeXN0ZW1FeGl0KCdSdW5uZXIgZGlhZ25vc3RpY3MgbXVzdCBiZSBkaXNhYmxlZCBmb3IgcmV2aWV3JykK'), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
      -
        "name": "Recheck current human admission"
        "shell": "bash"
        "run": |
          python3 - verify <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "with":
          "path": "product"
          "ref": "${{ needs.admission.outputs.head }}"
          "persist-credentials": false
          "fetch-depth": 1
          "submodules": false
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "with":
          "path": "base"
          "ref": "${{ needs.admission.outputs.base }}"
          "persist-credentials": false
          "fetch-depth": 1
          "submodules": false
      -
        "name": "Select the admitted harness dependency against trusted source authority"
        "shell": "bash"
        "run": |
          python3 - select-harness <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "id": "harness"
        "env":
          "PROFILE": "${{ needs.admission.outputs.profile }}"
          "HARNESS_READ_TOKEN": "${{ secrets.EJM_HARNESS_TOKEN || github.token }}"
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "if": "${{ steps.harness.outputs.revision != '' }}"
        "with":
          "repository": "ejmlabs/ejm-harness"
          "ref": "${{ steps.harness.outputs.revision }}"
          "path": "harness"
          "persist-credentials": false
          "token": "${{ secrets.EJM_HARNESS_TOKEN || github.token }}"
      -
        "name": "Read optional public UI dependency from trusted main"
        "shell": "bash"
        "run": |
          python3 - ui-pin <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "id": "ui"
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "if": "${{ steps.ui.outputs.revision != '' }}"
        "with":
          "repository": "ejmlabs/ejm-ui"
          "ref": "${{ steps.ui.outputs.revision }}"
          "path": "ejm-ui"
          "persist-credentials": false
          "fetch-depth": 1
          "submodules": false
      -
        "name": "Archive admitted source"
        "shell": "bash"
        "run": |
          python3 -  <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
      -
        "name": "Recheck current human admission"
        "shell": "bash"
        "run": |
          python3 - verify <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
      -
        "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        "id": "sources"
        "with":
          "name": "admitted-sources"
          "path": "prepared/"
          "retention-days": 3
          "if-no-files-found": "error"
  "quality":
    "needs":
      - "admission"
      - "prepare"
    "if": "${{ github.run_attempt == 1 }}"
    "runs-on": "${{ matrix.os }}"
    "timeout-minutes": 45
    "permissions": {}
    "strategy":
      "fail-fast": false
      "matrix":
        "os": "${{ fromJSON(needs.admission.outputs.profile == 'ejm-harness' && '[\"ubuntu-24.04\",\"macos-15\",\"windows-2025\"]' || needs.admission.outputs.profile == 'ejm-cli' && '[\"ubuntu-24.04\",\"macos-15\"]' || needs.admission.outputs.profile == 'ejm-ide' && '[\"macos-15\"]' || '[\"ubuntu-24.04\"]') }}"
    "env":
      "CARGO_BUILD_JOBS": "default"
      "CARGO_INCREMENTAL": "0"
      "PROFILE": "${{ needs.admission.outputs.profile }}"
      "CI": "true"
    "steps":
      -
        "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"
        "with":
          "artifact-ids": "${{ needs.prepare.outputs.artifact }}"
          "merge-multiple": true
          "path": "prepared"
      -
        "name": "Extract source data safely"
        "shell": "bash"
        "run": |
          python3 - <<'PY'
          import os
          import tarfile
          from pathlib import Path
          for file in Path('prepared').glob('*.tar'):
              with tarfile.open(file) as archive:
                  archive.extractall('.', filter='data')
                  # Admitted sources must be newer than any restored build, so Cargo rebuilds every local crate.
                  for member in archive.getmembers():
                      if member.isfile():
                          os.utime(member.name)
          PY
      -
        "uses": "actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9"
        "id": "cache"
        "if": "${{ contains(fromJSON('[\"ejm-cli\",\"ejm-harness\",\"ejm-ide\",\"ejm-ui\"]'), needs.admission.outputs.profile) }}"
        "with":
          "path": |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ fromJSON('{"ejm-cli":"product/target","ejm-harness":"product/target","ejm-ide":"product/src-tauri/target","ejm-ui":"product/crates/ejm-tui/target"}')[needs.admission.outputs.profile] }}
          "key": "gate-quality-${{ runner.os }}-${{ needs.admission.outputs.base }}"
      -
        "name": "Discard any cache that is not main's exact build"
        "shell": "bash"
        "run": |
          rm -rf ~/.cargo/registry/index ~/.cargo/registry/cache ~/.cargo/git/db "$TARGET_DIR"
        "if": "${{ contains(fromJSON('[\"ejm-cli\",\"ejm-harness\",\"ejm-ide\",\"ejm-ui\"]'), needs.admission.outputs.profile) && steps.cache.outputs.cache-hit != 'true' }}"
        "env":
          "TARGET_DIR": "${{ fromJSON('{\"ejm-cli\":\"product/target\",\"ejm-harness\":\"product/target\",\"ejm-ide\":\"product/src-tauri/target\",\"ejm-ui\":\"product/crates/ejm-tui/target\"}')[needs.admission.outputs.profile] }}"
      -
        "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        "with":
          "node-version": "24"
      -
        "uses": "astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884"
        "with":
          "version": "0.9.26"
      -
        "name": "Install Linux harness keyring build prerequisites"
        "shell": "bash"
        "run": |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libdbus-1-dev
        "if": "${{ needs.admission.outputs.profile == 'ejm-harness' && runner.os == 'Linux' }}"
      -
        "name": "Install pinned Rust tools"
        "shell": "bash"
        "run": |
          if [[ "$PROFILE" == ejm-* ]]; then
            rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
            rustup default 1.99.1
            if [[ "$PROFILE" != ejm-ui ]]; then
          python3 -I - cargo-deny cargo-machete <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
            fi
          fi
      -
        "name": "Prepare ejm-cli remote test prerequisites"
        "if": "${{ needs.admission.outputs.profile == 'ejm-cli' }}"
        "uses": "./product/.github/actions/setup-ci"
      -
        "name": "Run the project's required gate without secrets or write tokens"
        "shell": "bash"
        "run": |
          cd product
          if [[ -d ../ejm-ui ]]; then
            npm --prefix ../ejm-ui ci --ignore-scripts
          fi
          case "$PROFILE" in
            ejm-cli) ./scripts/check ;;
            ejm-harness) npm ci --ignore-scripts; npm --prefix registry ci --ignore-scripts; ./scripts/check ;;
            ejm-ide) npm ci --ignore-scripts; npm run verify; npm run site:check; npm run site:build ;;
            ejm-ui)
              export npm_config_ignore_scripts=true
              npm ci --ignore-scripts
              npm rebuild node-pty --ignore-scripts=false
              npm run check
              npm run build
              npm run check:rust
              node scripts/pack-proof.mjs
              ;;
            ejmlabs) node scripts/check.mjs; npm --prefix site test; npm --prefix site run build ;;
            .github) python3 -m unittest discover -s tests -v; python3 scripts/build_workflows.py --check ;;
            *) exit 1 ;;
          esac
  "registry":
    "needs":
      - "admission"
      - "prepare"
    "if": "${{ github.run_attempt == 1 }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 25
    "permissions": {}
    "env":
      "CARGO_BUILD_JOBS": "default"
      "CARGO_INCREMENTAL": "0"
      "PROFILE": "${{ needs.admission.outputs.profile }}"
    "steps":
      -
        "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"
        "with":
          "artifact-ids": "${{ needs.prepare.outputs.artifact }}"
          "merge-multiple": true
          "path": "prepared"
      -
        "name": "Extract source data safely"
        "shell": "bash"
        "run": |
          python3 - <<'PY'
          import os
          import tarfile
          from pathlib import Path
          for file in Path('prepared').glob('*.tar'):
              with tarfile.open(file) as archive:
                  archive.extractall('.', filter='data')
                  # Admitted sources must be newer than any restored build, so Cargo rebuilds every local crate.
                  for member in archive.getmembers():
                      if member.isfile():
                          os.utime(member.name)
          PY
      -
        "uses": "actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9"
        "id": "cache"
        "if": "${{ contains(fromJSON('[\"ejm-harness\"]'), needs.admission.outputs.profile) }}"
        "with":
          "path": |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ fromJSON('{"ejm-harness":"product/registry/target"}')[needs.admission.outputs.profile] }}
          "key": "gate-registry-${{ runner.os }}-${{ needs.admission.outputs.base }}"
      -
        "name": "Discard any cache that is not main's exact build"
        "shell": "bash"
        "run": |
          rm -rf ~/.cargo/registry/index ~/.cargo/registry/cache ~/.cargo/git/db "$TARGET_DIR"
        "if": "${{ contains(fromJSON('[\"ejm-harness\"]'), needs.admission.outputs.profile) && steps.cache.outputs.cache-hit != 'true' }}"
        "env":
          "TARGET_DIR": "${{ fromJSON('{\"ejm-harness\":\"product/registry/target\"}')[needs.admission.outputs.profile] }}"
      -
        "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        "if": "${{ needs.admission.outputs.profile == 'ejm-harness' }}"
        "with":
          "node-version": "24"
      -
        "name": "Run separate registry gate when applicable"
        "shell": "bash"
        "run": |
          if [[ "$PROFILE" == ejm-harness ]]; then
            rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
            rustup default 1.99.1
          python3 -I - cargo-deny cargo-machete <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
            cargo install worker-build --version 0.8.7 --locked
            cd product
            if [[ -d ../ejm-ui ]]; then
              npm --prefix ../ejm-ui ci --ignore-scripts
            fi
            npm ci --ignore-scripts
            npm --prefix registry ci --ignore-scripts
            ./scripts/check-registry
          fi
  "standards":
    "needs":
      - "admission"
      - "prepare"
    "if": "${{ github.run_attempt == 1 }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 3
    "permissions": {}
    "env":
      "PROFILE": "${{ needs.admission.outputs.profile }}"
    "steps":
      -
        "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"
        "with":
          "artifact-ids": "${{ needs.prepare.outputs.artifact }}"
          "merge-multiple": true
          "path": "prepared"
      -
        "name": "Extract source data safely"
        "shell": "bash"
        "run": |
          python3 - <<'PY'
          import os
          import tarfile
          from pathlib import Path
          for file in Path('prepared').glob('*.tar'):
              with tarfile.open(file) as archive:
                  archive.extractall('.', filter='data')
                  # Admitted sources must be newer than any restored build, so Cargo rebuilds every local crate.
                  for member in archive.getmembers():
                      if member.isfile():
                          os.utime(member.name)
          PY
      -
        "name": "Validate shared public standards and version metadata"
        "shell": "bash"
        "run": |
          python3 - product "$PROFILE" <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
  "ai":
    "needs": "admission"
    "if": "${{ github.run_attempt == 1 && needs.admission.outputs.run == 'true' }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 12
    "environment": "legacy-review"
    "permissions":
      "contents": "read"
      "pull-requests": "write"
      "statuses": "read"
    "env":
      "PR_NUMBER": "${{ needs.admission.outputs.pr }}"
      "PR_HEAD": "${{ needs.admission.outputs.head }}"
      "PR_BASE": "${{ needs.admission.outputs.base }}"
      "ADMISSION_ID": "${{ needs.admission.outputs.admission }}"
      "GH_TOKEN": "${{ github.token }}"
    "outputs":
      "review": "${{ steps.review.outputs.review }}"
    "steps":
      -
        "name": "Require private review logs"
        "shell": "bash"
        "run": |
          python3 -  <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode('aW1wb3J0IG9zCmlmIG9zLmVudmlyb24uZ2V0KCdSVU5ORVJfREVCVUcnKSA9PSAnMSc6CiAgICByYWlzZSBTeXN0ZW1FeGl0KCdSdW5uZXIgZGlhZ25vc3RpY3MgbXVzdCBiZSBkaXNhYmxlZCBmb3IgcmV2aWV3JykK'), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
      -
        "name": "Recheck current human admission"
        "shell": "bash"
        "run": |
          python3 - verify <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
      -
        "name": "Require the review model key"
        "shell": "bash"
        "run": |
          test "$HAS_MODEL_KEY" = true
        "env":
          "HAS_MODEL_KEY": "${{ secrets.XAI_API_KEY != '' }}"
      -
        "name": "Install the pinned reviewer"
        "shell": "bash"
        "run": |
          cd "$RUNNER_TEMP"
          python3 -  <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
          set +e
          {
            python3 -m venv "$RUNNER_TEMP/reviewer-venv" &&
            "$RUNNER_TEMP/reviewer-venv/bin/python" -m pip install --isolated --no-cache-dir --require-hashes --no-deps --only-binary=:all: -r "$RUNNER_TEMP/reviewer-requirements.txt"
          } > "$RUNNER_TEMP/reviewer-install.log" 2>&1
          reviewer_status=$?
          set -e
          if [ "$reviewer_status" -ne 0 ]; then
            printf 'reviewer install exit %s\n' "$reviewer_status"
            exit "$reviewer_status"
          fi
        "env":
          "GH_TOKEN": ""
          "GITHUB_TOKEN": ""
          "PIP_CONFIG_FILE": "/dev/null"
      -
        "name": "Automated review"
        "shell": "bash"
        "run": |
          printf '{"action":"opened","pull_request":{"url":"https://api.github.com/repos/%s/pulls/%s"}}' "$GITHUB_REPOSITORY" "$PR_NUMBER" > "$RUNNER_TEMP/review-event.json"
          cd "$RUNNER_TEMP"
          GITHUB_EVENT_NAME=pull_request GITHUB_EVENT_PATH="$RUNNER_TEMP/review-event.json" "$RUNNER_TEMP/reviewer-venv/bin/python" -I -m pr_agent.servers.github_action_runner
        "id": "review"
        "env":
          "GITHUB_TOKEN": "${{ github.token }}"
          "XAI__KEY": "${{ secrets.XAI_API_KEY }}"
          "CONFIG__MODEL": "xai/grok-4.5"
          "CONFIG__FALLBACK_MODELS": "[]"
          "CONFIG__REASONING_EFFORT": "high"
          "CONFIG__AI_TIMEOUT": "225"
          "CONFIG__MAX_MODEL_TOKENS": "160000"
          "CONFIG__MAX_OUTPUT_TOKENS": "16000"
          "CONFIG__LOG_LEVEL": "INFO"
          "LITELLM_LOCAL_MODEL_COST_MAP": "True"
          "CONFIG__USE_REPO_SETTINGS_FILE": "false"
          "CONFIG__USE_GLOBAL_SETTINGS_FILE": "false"
          "GITHUB_ACTION_CONFIG__AUTO_REVIEW": "true"
          "GITHUB_ACTION_CONFIG__AUTO_DESCRIBE": "false"
          "GITHUB_ACTION_CONFIG__AUTO_IMPROVE": "false"
          "GITHUB_ACTION_CONFIG__ENABLE_OUTPUT": "true"
          "PR_REVIEWER__ENABLE_REVIEW_LABELS_SECURITY": "true"
          "PR_REVIEWER__ENABLE_REVIEW_LABELS_EFFORT": "true"
          "PR_REVIEWER__REQUIRE_MERGE_RECOMMENDATION": "true"
          "PR_REVIEWER__EXTRA_INSTRUCTIONS": "A changed `uses: ejmlabs/.github/.github/workflows/<name>.yml@<40 hex characters>` reference, or a `standards-ref` value equal to such a pin, selects a shared workflow that is maintained and reviewed in its own repository and is not part of this diff. Do not report its absence, or the inability to verify what that workflow does, as missing context or as a security concern. Still report a reference that is not a full 40-character commit hash, that names another repository or path, or that moves to an older revision, or whose surrounding workflow changes grant new permissions, secrets or triggers."
      -
        "name": "Recheck current human admission"
        "shell": "bash"
        "run": |
          python3 - verify <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
  "labels":
    "needs":
      - "admission"
      - "ai"
    "if": "${{ github.run_attempt == 1 && needs.admission.outputs.run == 'true' }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 3
    "permissions":
      "pull-requests": "read"
    "env":
      "PR_NUMBER": "${{ needs.admission.outputs.pr }}"
      "GH_TOKEN": "${{ github.token }}"
      "REVIEW_OUTPUT": "${{ needs.ai.outputs.review }}"
    "steps":
      -
        "name": "Fail on a security verdict or blocking review label"
        "shell": "bash"
        "run": |
          python3 - labels <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
  "finish":
    "needs":
      - "admission"
      - "prepare"
      - "quality"
      - "registry"
      - "standards"
      - "ai"
      - "labels"
    "if": "${{ github.run_attempt == 1 && always() && needs.admission.outputs.run == 'true' }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 3
    "permissions":
      "contents": "read"
      "pull-requests": "write"
      "statuses": "write"
    "env":
      "PR_NUMBER": "${{ needs.admission.outputs.pr }}"
      "PR_HEAD": "${{ needs.admission.outputs.head }}"
      "PR_BASE": "${{ needs.admission.outputs.base }}"
      "ADMISSION_ID": "${{ needs.admission.outputs.admission }}"
      "GH_TOKEN": "${{ github.token }}"
      "JOB_RESULTS": "${{ toJSON(needs) }}"
    "steps":
      -
        "name": "Publish required results only after live admission validation"
        "shell": "bash"
        "run": |
          python3 - finish <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
  "override":
    "if": "${{ github.run_attempt == 1 && github.event_name == 'pull_request_target' && github.event.action == 'unlabeled' }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 3
    "permissions":
      "contents": "read"
      "pull-requests": "read"
      "statuses": "write"
    "concurrency":
      "group": "human-command-${{ github.repository }}-${{ github.event.pull_request.number }}"
      "cancel-in-progress": false
    "steps":
      -
        "name": "Re-evaluate the review after a label removal"
        "shell": "bash"
        "run": |
          python3 - relabel <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "env":
          "GH_TOKEN": "${{ github.token }}"
