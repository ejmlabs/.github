# Generated by scripts/build_workflows.py. Edit scripts and regenerate.
"name": "Advisory PR guidance"
"on":
  "workflow_call": {}
"permissions": {}
"jobs":
  "guidance":
    "if": "${{ github.run_attempt == 1 && github.event_name == 'pull_request_target' && github.event.sender.type != 'Bot' }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 2
    "permissions":
      "contents": "read"
      "pull-requests": "write"
      "statuses": "read"
    "concurrency":
      "group": "pr-guidance-${{ github.repository }}-${{ github.event.number || github.event.issue.number }}"
      "cancel-in-progress": false
    "steps":
      -
        "name": "Refresh advisory PR next action from live metadata"
        "shell": "bash"
        "run": |
          python3 -  <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "env":
          "GH_TOKEN": "${{ github.token }}"
