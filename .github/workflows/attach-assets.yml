# Generated by scripts/build_workflows.py. Edit scripts and regenerate.
"name": "Attach verified build files"
"on":
  "workflow_call":
    "inputs":
      "commit":
        "required": true
        "type": "string"
      "build-workflow":
        "required": true
        "type": "string"
      "build-run-id":
        "required": true
        "type": "string"
      "version":
        "required": true
        "type": "string"
      "attest":
        "required": false
        "default": false
        "type": "boolean"
"permissions": {}
"concurrency":
  "group": "attach-assets-${{ github.repository }}"
  "cancel-in-progress": false
"jobs":
  "attach":
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 10
    "permissions":
      "contents": "write"
      "actions": "read"
      "id-token": "write"
      "attestations": "write"
    "env":
      "GH_TOKEN": "${{ github.token }}"
      "RELEASE_COMMIT": "${{ inputs.commit }}"
      "BUILD_WORKFLOW": "${{ inputs.build-workflow }}"
      "BUILD_RUN_ID": "${{ inputs.build-run-id }}"
      "RELEASE_VERSION": "${{ inputs.version }}"
    "steps":
      -
        "name": "Require the build run, tag and draft release to match"
        "shell": "bash"
        "run": |
          python3 -I - check <<'TRUSTED_PYTHON'
          import base64, bz2, hashlib, os
          _trusted_script = ''.join(os.environ[key] for key in ['EJM_TRUSTED_SCRIPT_0', 'EJM_TRUSTED_SCRIPT_1', 'EJM_TRUSTED_SCRIPT_2'])
          if hashlib.sha256(_trusted_script.encode('ascii')).hexdigest() != 'bfd10e73168ad7eae1be3de3eda2b5490c5c75416a51a367384594e5e4534452': raise ValueError('Trusted workflow payload integrity mismatch')
          exec(compile(bz2.decompress(base64.b64decode(_trusted_script, validate=True)), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "env":
          "EJM_TRUSTED_SCRIPT_0": ""
          "EJM_TRUSTED_SCRIPT_1": ""
          "EJM_TRUSTED_SCRIPT_2": ""
      -
        "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"
        "with":
          "name": "release-files"
          "run-id": "${{ inputs.build-run-id }}"
          "github-token": "${{ github.token }}"
          "path": "built"
      -
        "name": "Recompute digests and attach to the draft"
        "shell": "bash"
        "run": |
          python3 -I - attach <<'TRUSTED_PYTHON'
          import base64, bz2, hashlib, os
          _trusted_script = ''.join(os.environ[key] for key in ['EJM_TRUSTED_SCRIPT_0', 'EJM_TRUSTED_SCRIPT_1', 'EJM_TRUSTED_SCRIPT_2'])
          if hashlib.sha256(_trusted_script.encode('ascii')).hexdigest() != 'bfd10e73168ad7eae1be3de3eda2b5490c5c75416a51a367384594e5e4534452': raise ValueError('Trusted workflow payload integrity mismatch')
          exec(compile(bz2.decompress(base64.b64decode(_trusted_script, validate=True)), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "env":
          "EJM_TRUSTED_SCRIPT_0": ""
          "EJM_TRUSTED_SCRIPT_1": ""
          "EJM_TRUSTED_SCRIPT_2": ""
      -
        "uses": "actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be"
        "if": "${{ inputs.attest }}"
        "with":
          "subject-path": "built/*"
          "show-summary": false
