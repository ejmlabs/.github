# Generated by scripts/build_workflows.py. Edit scripts and regenerate.
"name": "Attach verified build files"
"on":
  "workflow_call":
    "inputs":
      "commit":
        "required": true
        "type": "string"
      "build-workflow":
        "required": true
        "type": "string"
      "build-run-id":
        "required": true
        "type": "string"
      "version":
        "required": true
        "type": "string"
      "attest":
        "required": false
        "default": false
        "type": "boolean"
"permissions": {}
"concurrency":
  "group": "attach-assets-${{ github.repository }}"
  "cancel-in-progress": false
"jobs":
  "attach":
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 10
    "permissions":
      "contents": "write"
      "actions": "read"
    "env":
      "GH_TOKEN": "${{ github.token }}"
      "RELEASE_COMMIT": "${{ inputs.commit }}"
      "BUILD_WORKFLOW": "${{ inputs.build-workflow }}"
      "BUILD_RUN_ID": "${{ inputs.build-run-id }}"
      "RELEASE_VERSION": "${{ inputs.version }}"
    "outputs":
      "digests": "${{ steps.attached.outputs.digests }}"
    "steps":
      -
        "name": "Require the build run and the draft release to match"
        "shell": "bash"
        "run": |
          python3 -I - check <<'TRUSTED_PYTHON'
          import base64, bz2
          exec(compile(bz2.decompress(base64.b64decode('')), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
      -
        "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"
        "with":
          "name": "release-files"
          "run-id": "${{ inputs.build-run-id }}"
          "github-token": "${{ github.token }}"
          "path": "built"
      -
        "name": "Recompute digests and attach to the draft"
        "shell": "bash"
        "run": |
          python3 -I - attach <<'TRUSTED_PYTHON'
          import base64, bz2
          exec(compile(bz2.decompress(base64.b64decode('')), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "id": "attached"
  "attest":
    "needs": "attach"
    "if": "${{ inputs.attest }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 10
    "permissions":
      "contents": "read"
      "actions": "read"
      "id-token": "write"
      "attestations": "write"
    "env":
      "GH_TOKEN": "${{ github.token }}"
      "RELEASE_COMMIT": "${{ inputs.commit }}"
      "BUILD_WORKFLOW": "${{ inputs.build-workflow }}"
      "BUILD_RUN_ID": "${{ inputs.build-run-id }}"
      "ATTACHED_DIGESTS": "${{ needs.attach.outputs.digests }}"
    "steps":
      -
        "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"
        "with":
          "name": "release-files"
          "run-id": "${{ inputs.build-run-id }}"
          "github-token": "${{ github.token }}"
          "path": "built"
      -
        "name": "Require the files to equal the attached files"
        "shell": "bash"
        "run": |
          python3 -I - confirm <<'TRUSTED_PYTHON'
          import base64, bz2
          exec(compile(bz2.decompress(base64.b64decode('')), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
      -
        "uses": "actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8"
        "with":
          "subject-path": "built/*"
          "show-summary": false
