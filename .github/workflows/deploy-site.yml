# Generated by scripts/build_workflows.py. Edit scripts and regenerate.
"name": "Deploy site"
"on":
  "workflow_call": {}
"permissions": {}
"jobs":
  "build":
    "if": "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 20
    "permissions":
      "contents": "read"
    "env":
      "PROFILE": "${{ github.event.repository.name }}"
    "concurrency":
      "group": "deploy-build-${{ github.repository }}"
      "cancel-in-progress": false
    "steps":
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "with":
          "path": "product"
          "ref": "${{ github.sha }}"
          "persist-credentials": false
          "fetch-depth": 1
          "submodules": false
      -
        "name": "Read main's reviewed dependency pins"
        "shell": "bash"
        "run": |
          python3 -I - warm-pins <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "id": "pins"
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "if": "${{ steps.pins.outputs.ui != '' }}"
        "with":
          "repository": "ejmlabs/ejm-ui"
          "ref": "${{ steps.pins.outputs.ui }}"
          "path": "ejm-ui"
          "persist-credentials": false
          "fetch-depth": 1
          "submodules": false
      -
        "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        "with":
          "node-version": "24"
      -
        "name": "Build the site without credentials"
        "shell": "bash"
        "run": |
          cd product
          if [[ ! -L .github && ! -L .github/site-build && -f .github/site-build && -x .github/site-build ]]; then
            export npm_config_ignore_scripts=true
            ./.github/site-build
          else
            case "$PROFILE" in
              ejmlabs)
                npm --prefix ../ejm-ui ci --ignore-scripts
                npm --prefix site ci --ignore-scripts
                npm --prefix site run build
                ;;
              ejm-cli)
                npm --prefix ../ejm-ui ci --ignore-scripts
                npm --prefix site ci --ignore-scripts
                npm --prefix site run build
                ;;
              ejm-harness)
                npm --prefix ../ejm-ui ci --ignore-scripts
                npm --prefix site ci --ignore-scripts
                npm --prefix site run build
                ;;
              ejm-ide)
                npm --prefix ../ejm-ui ci --ignore-scripts
                npm ci --ignore-scripts
                npm run site:build
                ;;
              ejm-ui)
                npm ci --ignore-scripts
                npm run build -w @ejm/gallery
                ;;
              ejm-calm)
                npm ci --ignore-scripts
                npm run build
                ;;
              *) exit 1 ;;
            esac
          fi
          case "$PROFILE" in
            ejmlabs) tar -cf "$RUNNER_TEMP/site.tar" site/wrangler.jsonc site/dist ;;
            ejm-cli) tar -cf "$RUNNER_TEMP/site.tar" site/wrangler.jsonc site/dist ;;
            ejm-harness) tar -cf "$RUNNER_TEMP/site.tar" site/wrangler.jsonc site/dist ;;
            ejm-ide) tar -cf "$RUNNER_TEMP/site.tar" distribution website/dist ;;
            ejm-ui) tar -cf "$RUNNER_TEMP/site.tar" apps/gallery/wrangler.jsonc apps/gallery/dist ;;
            ejm-calm) tar -cf "$RUNNER_TEMP/site.tar" wrangler.jsonc dist ;;
            *) exit 1 ;;
          esac
      -
        "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        "with":
          "name": "site"
          "path": "${{ runner.temp }}/site.tar"
          "retention-days": 7
          "if-no-files-found": "error"
  "staging":
    "needs": "build"
    "if": "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 10
    "environment": "staging"
    "permissions":
      "contents": "read"
      "actions": "read"
    "concurrency":
      "group": "deploy-staging-${{ github.repository }}"
      "cancel-in-progress": false
    "env":
      "PROFILE": "${{ github.event.repository.name }}"
    "steps":
      -
        "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"
        "with":
          "name": "site"
          "path": "artifact"
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "with":
          "path": "reviewed"
          "ref": "${{ github.sha }}"
          "persist-credentials": false
          "fetch-depth": 1
          "submodules": false
          "sparse-checkout": |
            /apps/gallery/wrangler.jsonc
            /distribution
            /site/wrangler.jsonc
            /wrangler.jsonc
          "sparse-checkout-cone-mode": false
      -
        "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        "with":
          "node-version": "24"
      -
        "name": "Install the pinned deployer"
        "shell": "bash"
        "run": |
          mkdir -p "$RUNNER_TEMP/deployer"
          cd "$RUNNER_TEMP/deployer"
          python3 -I -  <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
          npm ci --ignore-scripts --no-audit --no-fund
        "env":
          "GH_TOKEN": ""
          "GITHUB_TOKEN": ""
          "NPM_CONFIG_USERCONFIG": "/dev/null"
      -
        "name": "Require the staging environment's protections"
        "shell": "bash"
        "run": |
          python3 -I - protection staging <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "env":
          "GH_TOKEN": "${{ github.token }}"
      -
        "name": "Deploy the built site to staging"
        "shell": "bash"
        "run": |
          python3 -I - deploy staging <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "env":
          "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}"
  "production":
