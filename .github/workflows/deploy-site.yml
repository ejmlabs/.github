    "if": "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 10
    "environment": "production"
    "permissions":
      "contents": "read"
      "actions": "read"
    "concurrency":
      "group": "deploy-production-${{ github.repository }}"
      "cancel-in-progress": false
    "env":
      "PROFILE": "${{ github.event.repository.name }}"
    "steps":
      -
        "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"
        "with":
          "name": "site"
          "path": "artifact"
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "with":
          "path": "reviewed"
          "ref": "${{ github.sha }}"
          "persist-credentials": false
          "fetch-depth": 1
          "submodules": false
          "sparse-checkout": |
            /apps/gallery/wrangler.jsonc
            /distribution
            /site/wrangler.jsonc
            /wrangler.jsonc
          "sparse-checkout-cone-mode": false
      -
        "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        "with":
          "node-version": "24"
      -
        "name": "Install the pinned deployer"
        "shell": "bash"
        "run": |
          mkdir -p "$RUNNER_TEMP/deployer"
          cd "$RUNNER_TEMP/deployer"
          python3 -I -  <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
          npm ci --ignore-scripts --no-audit --no-fund
        "env":
          "GH_TOKEN": ""
          "GITHUB_TOKEN": ""
          "NPM_CONFIG_USERCONFIG": "/dev/null"
      -
        "name": "Require the production environment's protections"
        "shell": "bash"
        "run": |
          python3 -I - protection production <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "env":
          "GH_TOKEN": "${{ github.token }}"
      -
        "name": "Deploy the built site to production"
        "shell": "bash"
        "run": |
          python3 -I - deploy production <<'TRUSTED_PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'trusted-workflow.py', 'exec'))
          TRUSTED_PYTHON
        "env":
          "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}"
