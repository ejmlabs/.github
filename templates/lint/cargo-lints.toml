# Shared strict Rust lints. Copy into the workspace Cargo.toml as [workspace.lints.*]
# (members set `[lints] workspace = true`), or as [lints.*] for a single crate.
# A repository may be stricter (for example unsafe_code = "forbid"), never looser.
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
mem_forget = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
